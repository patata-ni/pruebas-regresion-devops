<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gestor de tareas — Regresión</title>
<style>
:root{font:16px system-ui,Segoe UI,sans-serif;color:#e6ebfa;background:#0b1020}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at top,#24376a,#0b1020 60%)}
main{width:min(100%,660px);background:#141d35;border:1px solid #33415e;border-radius:24px;padding:30px;box-shadow:0 24px 70px #05091580}
h1{margin:0 0 8px;font-size:30px}p{color:#a7b5d3;margin:0 0 25px}
form{display:flex;gap:10px}input{flex:1;min-width:0;padding:14px;border:1px solid #3e5074;background:#10172b;color:#fff;border-radius:12px;font:inherit}
button{cursor:pointer;border:0;border-radius:12px;padding:12px 17px;font:inherit;background:#7866fb;color:white}button:hover{filter:brightness(1.12)}
.filters{display:flex;gap:8px;margin:24px 0}.filters button{background:#293653;font-size:14px}.filters button.active{background:#7866fb}
ul{padding:0;list-style:none;display:grid;gap:10px}li{display:flex;align-items:center;gap:12px;padding:13px;background:#1e2a46;border-radius:12px}
li label{display:flex;align-items:center;gap:12px;flex:1;overflow-wrap:anywhere}li input{flex:0 0 auto;accent-color:#7866fb;width:18px;height:18px}li.done span{text-decoration:line-through;color:#8493b0}
li button{background:#54344c;color:#ffb3c2;padding:9px 12px}
small{display:block;color:#94a5c7;margin-top:18px}#empty{padding:20px;text-align:center;color:#95a4c1}
</style></head><body><main><h1>✓ Gestor de tareas</h1><p>Demostración de pruebas de regresión en DevOps</p>
<form id="form"><input id="nueva" placeholder="Escribe una nueva tarea..." required><button>Agregar</button></form>
<div class="filters" role="group" aria-label="Filtrar tareas"><button data-filter="todas" class="active">Todas</button><button data-filter="pendientes">Pendientes</button><button data-filter="completadas">Completadas</button></div>
<ul id="lista"></ul><div id="empty" hidden>Sin tareas en esta categoría</div><small>Para introducir el error: reemplaza src/tareas.js por variantes/tareas-con-error.js y recarga la página.</small>
</main><script type="module" src="/app.js"></script></body></html>
